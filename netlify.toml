[build]
  command = "cd mallku-react && npm install && npm run build && cd .. && mkdir -p dashboard && cp -r mallku-react/dist/* dashboard/"
  publish = "."

# Redirige la raíz automáticamente al dashboard
[[redirects]]
  from = "/"
  to = "/dashboard/"
  status = 301
  force = false

# SPA fallback: el dashboard de React no da 404 al refrescar
[[redirects]]
  from = "/dashboard/*"
  to = "/dashboard/index.html"
  status = 200
