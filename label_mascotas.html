<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta Oficial Mascotas - Mallku</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --mallku-green: #304426;
            --cannabis-gold: #E5CD75;
            /* Dorado suave pero vibrante */
            --cannabis-light-green: #Aee373;
            /* Verde brillante de cannabis */
            --mascotas-gradient: linear-gradient(135deg, var(--cannabis-gold), rgba(0, 255, 150, 1));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            color: #f5f5f0;
        }

        .label-outer {
            padding: 0;
            background: transparent;
            box-shadow: none;
        }

        /* WRAPPER PARA EL BORDE GRADIENTE */
        .border-wrapper {
            width: 1006px;
            /* 1000 + 6px de borde */
            height: 341px;
            /* 335 + 6px de borde */
            padding: 3px;
            background: rgba(0, 255, 150, 1);
            border-radius: 8px;
            /* Pequeño redondeado para estética web */
            display: flex;
            align-items: center;
            justify-content: center;
            /* Neón Blanco Elegante */
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6),
                0 10px 50px rgba(0, 0, 0, 0.8);
        }

        .label-container {
            width: 1000px;
            height: 335px;
            background-color: var(--mallku-green);
            background-image:
                url('./assets/label_background.png'),
                radial-gradient(circle at center, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.4) 100%);
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            display: block;
        }

        /* TEXTURE OVERLAY */
        .texture-overlay {
            position: absolute;
            inset: 0;
            background: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            opacity: 0.15;
            pointer-events: none;
            z-index: 10;
        }

        /* LEFT SIDE - Badges with Gradient Halos */
        .gold-seal {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 15;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 255, 150, 1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .gold-seal img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .volume-badge {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #e4decb;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            z-index: 15;
            border: 1px solid rgba(0, 255, 150, 1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* ARCHED TEXT */
        .arched-header {
            position: absolute;
            top: 15px;
            left: 30px;
            width: 500px;
            height: 180px;
            z-index: 11;
            pointer-events: none;
        }

        .svg-text {
            fill: #f5f5f0;
            font-size: 18px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            letter-spacing: 3px;
        }

        .illustration-box {
            position: absolute;
            top: 60px;
            left: 150px;
            width: 260px;
            height: 200px;
            z-index: 12;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .illustration-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* Neón Láser Ultra-Fino: Perfilado nítido con mínimo verde */
            filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 4px rgba(0, 255, 150, 0.8));
            opacity: 1;
            image-rendering: high-quality;
        }

        /* BOTTOM LEFT TITLES */
        .bottom-left-text {
            position: absolute;
            bottom: 20px;
            left: 80px;
            width: 400px;
            text-align: center;
            z-index: 15;
            white-space: nowrap;
        }

        .bottom-left-text .type {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 3px #fff, 0 0 8px rgba(0, 255, 150, 1), 0 0 15px rgba(0, 255, 150, 0.8);
        }

        .bottom-left-text .name {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-top: 8px;
            color: #ffffff;
            text-shadow: 0 0 2px #fff, 0 0 6px var(--cannabis-light-green), 0 0 12px var(--cannabis-light-green);
        }

        /* RIGHT PANEL */
        .right-panel {
            position: absolute;
            top: 25px;
            left: 540px;
            width: 410px;
            height: 285px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .separator {
            width: 410px;
            height: 1px;
            background: #e6e6dc;
            opacity: 0.8;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
            margin: 0;
        }

        .origin-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            white-space: nowrap;
            color: #ffffff;
            text-shadow: 0 0 3px #fff, 0 0 8px rgba(0, 255, 150, 1), 0 0 15px rgba(0, 255, 150, 0.8);
        }

        .benefits-list {
            list-style: none;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .benefits-list li {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 20px;
        }

        .uso-box {
            text-align: center;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        .uso-box .resp {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .uso-box .gotas {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        .btn-print {
            margin-top: 30px;
            padding: 15px 40px;
            background: #fff;
            color: #111;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease-in-out;
        }

        .btn-print:hover {
            background: var(--mallku-green);
            color: #fff;
            transform: translateY(-3px);
        }

        @media print {
            body {
                background: white !important;
                padding: 0;
                margin: 0;
                display: block !important;
            }

            .btn-print {
                display: none !important;
            }

            .label-outer {
                box-shadow: none !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 9cm !important;
                height: 3.4cm !important;
                overflow: hidden !important;
                page-break-inside: avoid;
            }

            .border-wrapper {
                padding: 0 !important;
                background: transparent !important;
                width: auto !important;
                height: auto !important;
                box-shadow: none !important;
            }

            .label-container {
                box-shadow: none !important;
                border: 3px solid var(--cannabis-gold) !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                transform-origin: top left !important;
                transform: scale(0.34015, 0.38359) !important;
            }

            @page {
                size: a4;
                margin: 0.5cm;
            }
        }
    </style>
</head>

<body>

    <div class="label-outer">
        <div class="border-wrapper">
            <div class="label-container">
                <div class="texture-overlay"></div>

                <!-- LEFT SIDE -->
                <div class="gold-seal">
                    <img src="WhatsApp%20Image%202026-02-04%20at%2011.03.07%20PM.jpeg" alt="Logo Mallku Original">
                </div>

                <div class="volume-badge">15ml</div>

                <svg class="arched-header" viewBox="0 0 500 180">
                    <path id="headerCurve" d="M 60,150 A 190,130 0 0,1 440,150" fill="transparent" />
                    <text class="svg-text">
                        <textPath xlink:href="#headerCurve" startOffset="50%" text-anchor="middle">
                            ACEITE ESENCIAL DE CANNABIS
                        </textPath>
                    </text>
                </svg>

                <!-- Illustration -->
                <div class="illustration-box">
                    <img id="pet-img" src="mascotas_nobg.png" alt="Mascotas Mallku">
                </div>

                <div class="bottom-left-text">
                    <div class="type">MALLKU</div>
                    <div class="name">PARA MASCOTAS</div>
                </div>

                <!-- RIGHT PANEL -->
                <div class="right-panel">
                    <div class="separator"></div>
                    <div class="origin-title">PRODUCTO 100% NARIÑENSE</div>
                    <div class="separator"></div>

                    <ul class="benefits-list">
                        <li>Epilepsia</li>
                        <li>Artritis</li>
                        <li>Ansiedad</li>
                        <li>Inflamación</li>
                        <li>Falta de apetito</li>
                        <li>Cáncer</li>
                    </ul>

                    <div class="separator"></div>

                    <div class="uso-box">
                        <div class="resp">Uso con responsabilidad</div>
                        <div class="gotas">Según peso o 5 a 7 Gotas</div>
                    </div>

                    <div class="separator"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="btn-print" onclick="window.print()">Descargar / Imprimir Etiquetas</button>

</body>

</html>
