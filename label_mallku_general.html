<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label Publicitario General - Mallku Sentires Andinos</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --mallku-green: #1A4331;
            /* Verde exacto de la referencia del usuario */
            --gold-mallku: #D4AF37;
            --neon-green-mallku: rgba(0, 255, 150, 1);
            --crema-claro: #efeade;
            --white-soft: #f5f5f0;
            --light-green: #a8e063;
            /* Un verdecito para el título superior */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            color: var(--white-soft);
        }

        .label-outer {
            padding: 0;
            background: transparent;
        }

        .border-wrapper {
            width: 840px;
            /* Reducido espacio en blanco del centro */
            height: 380px;
            /* Aumentado bordecito arriba y abajo */
            padding: 3px;
            background: #e811ff;
            /* Fucsia exacto de la imagen */
            border-radius: 0;
            /* Filos rectos */
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 6px rgba(232, 17, 255, 0.8),
                0 0 18px rgba(232, 17, 255, 0.5),
                0 15px 40px rgba(0, 0, 0, 0.8);
            /* Glow de la tarjeta reducido */
        }

        .label-container {
            width: 834px;
            /* Reducido espacio en blanco del centro */
            height: 374px;
            /* Aumentado bordecito arriba y abajo */
            background-color: var(--mallku-green);
            position: relative;
            overflow: hidden;
            border-radius: 0;
            /* Filos rectos */
            display: flex;
            justify-content: space-between;
        }

        .texture-overlay {
            display: none;
            /* Cero efectos, verde totalmente limpio y parejo */
            position: absolute;
            inset: 0;
            background: url('https://www.transparenttextures.com/patterns/natural-paper.png');
            opacity: 0.12;
            pointer-events: none;
            z-index: 10;
        }

        /* COLUMNA IZQUIERDA: BRANDING */
        .branding-left {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* Alineado desde arriba */
            padding: 16px 2px 10px 10px;
            /* Reducido para subir Mallku */
            z-index: 15;
            gap: 9px;
            /* Juntamos elementos para que suban */
        }

        .branding-title-main {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: 7px;
            /* Más delgado */
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: -5px;
            /* Efecto glow morado intenso */
            text-shadow:
                0 1px 0 #e811ff, 0 -1px 0 #e811ff, 1px 0 0 #e811ff, -1px 0 0 #e811ff,
                1px 1px 0 #e811ff, 1px -1px 0 #e811ff, -1px 1px 0 #e811ff, -1px -1px 0 #e811ff,
                0 0 15px #e811ff, 0 0 30px #e811ff, 0 0 45px rgba(232, 17, 255, 0.8);
        }

        .branding-title-sub {
            font-size: 19px;
            font-weight: 600;
            /* Más delgado */
            letter-spacing: 6px;
            /* Más separado */
            text-transform: uppercase;
            color: #ffffff;
            /* Se evita -webkit-text-stroke para que no salgan lineas raras en PDF */
            text-shadow: 
                0.5px 0.5px 0 #f7e296, -0.5px -0.5px 0 #f7e296, 
                0.5px -0.5px 0 #f7e296, -0.5px 0.5px 0 #f7e296,
                0 0.5px 0 #f7e296, 0 -0.5px 0 #f7e296,
                0.5px 0 0 #f7e296, -0.5px 0 0 #f7e296;
            margin-bottom: 5px;
        }

        .branding-logo-circle {
            width: 175px;
            /* Un poquito más grande */
            height: 175px;
            border-radius: 50%;
            padding: 4px;
            background: #ffffff;
            /* Borde interior blanco */
            box-shadow: 0 0 8px #ffffff, 0 0 18px rgba(255, 255, 255, 0.6);
            /* Resplandor blanco neón */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .branding-logo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #000;
        }

        .branding-phrase {
            font-size: 19.5px;
            /* Un punto más grandecito general */
            font-weight: 600;
            letter-spacing: 2px;
            /* Ajuste para mantener los 2 renglones con fuente mayor */
            text-transform: uppercase;
            color: #ffffff;
            line-height: 1.3;
            text-align: center;
            margin-top: 15px;
            white-space: nowrap;
            /* Se evita -webkit-text-stroke para que no salgan lineas raras en PDF */
            text-shadow: 
                0.5px 0.5px 0 #e811ff, -0.5px -0.5px 0 #e811ff, 
                0.5px -0.5px 0 #e811ff, -0.5px 0.5px 0 #e811ff,
                0 0.5px 0 #e811ff, 0 -0.5px 0 #e811ff,
                0.5px 0 0 #e811ff, -0.5px 0 0 #e811ff;
        }

        /* COLUMNA DERECHA: PRODUCTOS Y CONTACTO */
        .right-panel {
            flex: 1;
            height: 100%;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* Alineado desde arriba */
            padding: 16px 10px 10px 2px;
            /* Margen superior igual a Mallku */
            gap: 12px;
        }

        .separator {
            width: 360px;
            height: 0px;
            border-top: 2px solid rgba(255, 255, 255, 0.7); /* Renderizado como línea vectorial, a prueba de PDFs */
            margin: 4px 0; /* Espacio para que respire la línea elegante */
        }

        .origin-title-green {
            font-size: 23px;
            /* Subido un poco */
            font-weight: 600;
            /* Más delgado */
            letter-spacing: 6px;
            /* Más separado */
            text-transform: uppercase;
            color: #ffffff;
            /* Se evita -webkit-text-stroke para que no salgan lineas raras en PDF */
            text-shadow: 
                0.5px 0.5px 0 #f7e296, -0.5px -0.5px 0 #f7e296, 
                0.5px -0.5px 0 #f7e296, -0.5px 0.5px 0 #f7e296,
                0 0.5px 0 #f7e296, 0 -0.5px 0 #f7e296,
                0.5px 0 0 #f7e296, -0.5px 0 0 #f7e296;
        }

        .section-title {
            font-size: 23px;
            /* Subido un poco */
            font-weight: 600;
            /* Más delgado */
            letter-spacing: 6px;
            /* Más separado */
            text-transform: uppercase;
            color: #ffffff;
            /* Se evita -webkit-text-stroke para que no salgan lineas raras en PDF */
            text-shadow: 
                0.5px 0.5px 0 #f7e296, -0.5px -0.5px 0 #f7e296, 
                0.5px -0.5px 0 #f7e296, -0.5px 0.5px 0 #f7e296,
                0 0.5px 0 #f7e296, 0 -0.5px 0 #f7e296,
                0.5px 0 0 #f7e296, -0.5px 0 0 #f7e296;
        }

        .products-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 9px 15px; /* Reducido un poquito para evitar amontonamiento con letras más grandes */
            width: 98%; /* Más espacio horizontal */
            margin: 3px 0;
        }

        .product-item {
            font-size: 16px;
            /* Aumentado tamaño de productos */
            font-weight: 800;
            letter-spacing: 1.2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
        }

        .contact-vertical-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 7px;
            width: 320px;
            /* Expandido para texto más grande */
            margin-top: 6px;
            /* Subido para que no se peque abajo */
            transform: translateX(-35px);
            /* Más a la izquierda para darle espacio al correo larguísimo en la derecha */
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .contact-item img,
        .contact-item svg {
            width: 25px;
            height: 25px;
            border-radius: 4px;
        }

        /* Colores originales sin neón ni efectos */
        .color-wpp {
            color: #25D366;
        }

        .color-ig {
            color: #E1306C;
        }

        .color-fb {
            color: #1877F2;
        }

        .contact-text {
            font-size: 15.5px;
            /* Bajado un tris */
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            white-space: nowrap;
        }

        .btn-print {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--gold-mallku);
            color: #000;
            border: none;
            border-radius: 40px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            transition: 0.3s;
        }

        .btn-print:hover {
            background: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--gold-mallku);
        }

        @media print {
            @page {
                margin: 10mm;
                /* Márgenes iguales alrededor */
            }

            .label-outer {
                zoom: 0.85; /* Usa zoom en vez de transform para evitar que el navegador deforme los bordes en PDF */
                padding: 20px !important; 
            }

            .label-container {
                width: 100% !important;
                height: 100% !important;
            }

            body {
                background: white !important;
                justify-content: flex-start !important;
                /* Lo pega a la parte superior de la hoja */
                align-items: center !important;
                /* Centrado horizontal */
                min-height: auto !important;
                padding: 0 !important;
            }

            * {
                -webkit-print-color-adjust: exact !important;
                /* Fuerza la mejor calidad y colores exactos */
                print-color-adjust: exact !important;
            }

            .btn-print {
                display: none !important;
            }

            .border-wrapper {
                /* Forzamos un borde vectorial real más grueso para PDF */
                box-shadow: none !important;
                background-color: transparent !important;
                padding: 0 !important;
                border: 5px solid #e811ff !important; /* Borde más grueso y notable */
            }

            .separator {
                /* Forzamos que los separadores se dibujen en PDF obligatoriamente sin importar configuración de tinta */
                border-top: 2px solid rgba(255, 255, 255, 0.8) !important;
                background-color: transparent !important;
            }
        }
    </style>
</head>

    <button class="btn-print" onclick="window.print()">Descargar para Publicidad</button>

</body>

</html>
